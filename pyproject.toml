[project]
name = "lean-code-review"
version = "0.1.0"
description = "Independent read-only review with portable reviewer adapters"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "pyyaml>=6,<7", "ruff>=0.12"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: optional authenticated CLI smoke"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
